# clusters/my-cluster/prod.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-prod
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./overlays/production # Шлях до папки з kustomization.yaml, який ми виправляли
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: production
